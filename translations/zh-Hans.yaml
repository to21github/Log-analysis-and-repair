configuration:
  scan_interval:
    name: 扫描间隔（秒）
    description: 每隔多久自动抓取并分析一次日志，最小 60 秒
  log_lines:
    name: 日志行数
    description: 每次从 Core / Supervisor 日志末尾抓取的最大行数
  auto_repair:
    name: 自动修复
    description: 默认关闭（手动模式）。开启后扫描发现可修复问题即自动执行；关闭时请在网页面板中逐项点击「修复」按钮
  repair_cooldown:
    name: 修复冷却（秒）
    description: 自动模式下同一问题两次修复之间的最小间隔，避免反复重启造成抖动（手动点击修复不受此限制）
  restart_crashed_addons:
    name: 重启崩溃插件
    description: 检测到插件状态为 error 时自动重启（本插件自身除外）
  reload_integrations:
    name: 重载异常集成
    description: 对初始化失败、实体大量不可用的集成自动执行重载
  repair_mqtt:
    name: 修复 MQTT 断连
    description: 检测到 MQTT 连接断开时自动重载 MQTT 集成以恢复连接
  purge_recorder:
    name: 清理历史数据库
    description: 数据库报错（如 locked）时自动清理旧历史数据减负
  keep_reports:
    name: 保留报告份数
    description: 历史报告归档保留的最大份数，超出后自动删除最旧的
